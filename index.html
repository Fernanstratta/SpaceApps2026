<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Terranauta: recurso educativo para explorar conceptos astronómicos de la Tierra y la Luna."
    />
    <meta name="theme-color" content="#000000" />
    <!--
      País del visitante para elegir el idioma inicial (ES / EN). Vacío en hosting
      estático. El backend o el edge puede rellenarlo al servir este HTML
      (p. ej. content="MX"). Ver docs/i18n.md.
    -->
    <meta name="terranauta-country" content="" />
    <title>Terranauta</title>
    <script>
      // Aplica el tema guardado antes de pintar para evitar un destello del otro modo.
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('terranauta-theme');
          if (stored === 'dark' || stored === 'light') theme = stored;
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <noscript>
      Terranauta necesita JavaScript para funcionar. Actívalo en tu navegador. /
      <span lang="en">Terranauta needs JavaScript to work. Please enable it in your browser.</span>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
